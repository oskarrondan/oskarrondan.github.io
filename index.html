<script>
/* Carta de ajuste mientras carga: barras que ruedan, nieve, líneas que se tuercen y una banda oscura que sube, como una tele buscando el canal */
(function(){ const c=document.getElementById('bootc'), x=c.getContext('2d'), w=240, h=135; c.width=w; c.height=h;
  const B=['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'], B2=['#0000c0','#111','#c000c0','#111','#00c0c0','#111','#c0c0c0'];
  const bars=document.createElement('canvas'); bars.width=w; bars.height=h; const b=bars.getContext('2d');
  B.forEach((col,i)=>{ b.fillStyle=col; b.fillRect(Math.floor(i*w/7),0,Math.ceil(w/7)+1,h*.76); }); B2.forEach((col,i)=>{ b.fillStyle=col; b.fillRect(Math.floor(i*w/7),h*.76,Math.ceil(w/7)+1,h*.24); });
  const img=x.createImageData(w,h), d=img.data, nz=document.createElement('canvas'); nz.width=w; nz.height=h; const nx=nz.getContext('2d');
  let roll=0, t0=performance.now();
  function f(now){ if(document.getElementById('boot').classList.contains('off')){ return; }
    const t=(now-t0)/1000, lock=Math.min(.85,(window.__bootP||0)*.85);
    roll=(roll+(1-lock)*(1.6+Math.sin(t*1.7)*1.2))%h; const ry=Math.round(roll);
    x.fillStyle='#000'; x.fillRect(0,0,w,h);
    for(let y=0;y<h;y++){ const sy=(y+ry)%h, j=Math.sin(y*.21+t*9)*(1-lock)*3+(Math.random()<.02*(1-lock)?(Math.random()-.5)*30:0); x.drawImage(bars,0,sy,w,1,j,y,w,1); }
    const vb=((t*38)%(h*1.6))-h*.3, gr=x.createLinearGradient(0,vb,0,vb+h*.3); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.5,'rgba(0,0,0,.45)'); gr.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=gr; x.fillRect(0,0,w,h);
    for(let i=0;i<d.length;i+=4){ const v=Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=Math.random()<.5?(60+120*(1-lock)):0; } nx.putImageData(img,0,0); x.drawImage(nz,0,0);
    x.fillStyle='rgba(0,0,0,.25)'; for(let y=0;y<h;y+=2) x.fillRect(0,y,w,1);
    requestAnimationFrame(f); }
  requestAnimationFrame(f);
})();
</script>

/* El nombre es una señal de televisión. El ratón, como un imán, le hace perder la sincronía. */
const sigs={};
function sigMake(id,L,hf){
  const ff=p=>`700 ${p}px HV, Helvetica, Arial, sans-serif`, m=document.createElement('canvas').getContext('2d');
  let px=H*hf; m.font=ff(px); const mw=Math.max(...L.map(l=>m.measureText(l).width)); if(mw>W*.84){ px*=W*.84/mw; }
  const lh=px*.92, top=H/2-lh*L.length/2, out={W,H,px,top:top-px*.12,bot:top+lh*L.length+px*.12,ch:[]};
  for(const col of ['#ff2a00','#00ff3c','#2a3bff']){ const k=document.createElement('canvas'); k.width=Math.round(W*DPR); k.height=Math.round(H*DPR);
    const y=k.getContext('2d'); y.scale(DPR,DPR); y.font=ff(px); y.textAlign='center'; y.textBaseline='middle'; y.fillStyle=col; L.forEach((l,i)=>y.fillText(l,W/2,top+lh*(i+.5))); out.ch.push(k); }
  return sigs[id]=out;
}
/* loss: 0 señal limpia, 1 sin señal · roll: px de giro vertical (se pierde el vertical hold) */
function signal(id,L,yc,hf,loss,roll,fbk){
  let s=sigs[id]; if(!s||s.W!==W||s.H!==H) s=sigMake(id,L,hf);
  const tt=(performance.now()-st.t0)/1000, on=st.mouse.x>-1&&!reduce&&!st.focus, mx=st.mag.x*W, my=st.mag.y*H;
  const near=on?Math.exp(-Math.pow((mx-W/2)/(W*.42),2)):0, sh=Math.max(2,Math.round(3*S)), dy=(yc-.5)*H, P=H*1.18;
  let worst=0; g.save(); g.globalCompositeOperation='lighter';
  for(let y=s.top;y<s.bot;y+=sh){
    let sy=y+dy-roll; sy=((sy+H*.09)%P+P)%P-H*.09;
    if(loss>.15&&hsh(y|0,(tt*30)|0)<loss*.45) continue;
    const d=(sy-my)/(H*.085), tr=on?Math.exp(-d*d)*near*(.35+st.speed*1.4):0; worst=Math.max(worst,tr);
    const dx=Math.sin(y*.031+tt*2.1)*1.6*S*(1+loss*5)+(hsh(y|0,(tt*24)|0)-.5)*loss*W*.07+tr*W*.09*Math.sin(sy*.11+tt*16)+tr*W*.04;
    const sep=(fbk?7:1.6+tr*20+loss*16)*S, sx=0, sw=W*DPR, syy=y*DPR, shh=sh*DPR;
    if(fbk){ g.drawImage(s.ch[0],sx,syy,sw,shh,dx,sy,W,sh); continue; }
    g.drawImage(s.ch[0],sx,syy,sw,shh,dx-sep,sy,W,sh); g.drawImage(s.ch[1],sx,syy,sw,shh,dx,sy,W,sh); g.drawImage(s.ch[2],sx,syy,sw,shh,dx+sep,sy,W,sh);
  }
  g.restore();
  if(roll>1&&!fbk){ const by=((-roll)%P+P)%P-H*.09; g.fillStyle='#000'; g.fillRect(0,by-H*.045,W,H*.07); }
  return {top:s.top+dy,bot:s.bot+dy,tear:worst};
}

  if(list.length>1){ const w1=button('←',x,yb,'fprev',go(-1),seg.cfg,seg.cbg); button('→',x+w1+10*S,yb,'fnext',go(1),seg.cfg,seg.cbg); }
  button('CERRAR  ×',W-W*.06,H*.14,'fclose',()=>{st.focus=null},seg.cfg,seg.cbg,'right'); g.globalAlpha=1;
}
function tc(){ const f=Math.floor((performance.now()-st.t0)/40), p=n=>String(n).padStart(2,'0'); return `${p(Math.floor(f/90000))}:${p(Math.floor(f/1500)%60)}:${p(Math.floor(f/25)%60)}:${p(f%25)}`; }
const wOf=s=>s.wipe?.42/s.len:0;
function goSeg(k){ const s=SEGS[Math.max(0,Math.min(SEGS.length-1,k))]; criStop(); if(s!==curSeg) st.zap=1; st.extra=null; st.focus=null; st.tp=Math.min(st.max,(s.start+(s.k?wOf(s)*s.len+.25:0)+(s.type==='end'?.3:0))*H); }
function drawHUD(seg){
  const pad=Math.max(W*.03,16), top=30*S, fg=seg.cfg;
  mono('OSKAR RONDÁN',pad,top+4*S,fg);
  { const lab='☰  LISTA DE CANALES   M'; g.font=F(13*S,MONO,'500'); try{g.letterSpacing='2px'}catch(e){} const tw=g.measureText(lab).width; try{g.letterSpacing='0px'}catch(e){}
    const bx=pad+150*S, bw=tw+28*S, bh=30*S, by=top-bh/2-1*S, on=hit(bx,by,bw,bh,()=>{ st.menu=!st.menu; },'menu'), bl=on||st.menu||Math.floor(performance.now()/650)%2===0;
    g.fillStyle=on?SIGNAL:fg; if(bl) g.fillRect(bx,by,bw,bh); g.strokeStyle=on?SIGNAL:fg; g.lineWidth=1.5; g.strokeRect(bx+.5,by+.5,bw-1,bh-1); mono(lab,bx+14*S,top+4*S,bl?(on?'#ffffff':seg.cbg):fg); }
  g.fillStyle=Math.floor(performance.now()/600)%2?SIGNAL:rgba(fg,.3); g.beginPath(); g.arc(W-pad-178*S,top,4.5*S,0,7); g.fill();
  mono('REC  '+tc(),W-pad,top+4*S,fg,'right'); mono(seg.label||('CH '+String(seg.ch).padStart(2,'0')+'  ·  '+seg.name),W/2,top+4*S,fg,'center');
  const y=H-30*S, x1=pad, len=W-pad*2, pr=st.p/st.max; g.fillStyle=rgba(fg,.45); g.fillRect(x1,y,len,1);
  for(let k=0;k<=120;k++){ const tall=k%10===0; g.fillRect(x1+len*k/120,y-(tall?8:4)*S,1,(tall?8:4)*S); }
  SEGS.forEach(s=>{ const sx=x1+len*s.start/TOTAL, on=hit(sx-16*S,y-34*S,32*S,34*S,()=>goSeg(s.k),'r'+s.k);
    mono(s.sub?'·'+s.sub:String(s.ch).padStart(2,'0'),sx+2,y-14*S,on||s===seg?fg:rgba(fg,.55),'left',11.5); });
  const mx=x1+len*pr; g.fillStyle=SIGNAL; g.beginPath(); g.moveTo(mx,y+3); g.lineTo(mx-6*S,y+12*S); g.lineTo(mx+6*S,y+12*S); g.fill();
  const age=(performance.now()-st.osd.t)/1000;
  if(age<1.4&&st.osd.text) txt(st.osd.text,W-pad,84*S,F(34*S,MONO,'500'),rgba(fg,age<1?.9:.9*(1.4-age)/.4),'right','alphabetic',2);
}
function drawScene(){
  if(glassUsed){ gx.clearRect(0,0,W,H); glassDirty=true; } glassUsed=false;
  hits=[]; pieces=[]; wanted={}; g=g0; LATE=[];
  if(st.extra!=null){ drawExtra(); drawHUD(EX); if(st.focus) drawFocus(EX); if(st.ma>.01) drawMenu(); return; }
  const U=st.p/H; let seg=SEGS[SEGS.length-1]; for(const s of SEGS){ if(U<s.start+s.len){ seg=s; break; } }
  const t=cl((U-seg.start)/seg.len), w=wOf(seg); cur=seg; curSeg=seg; if(seg.type!=='end') st.snap=null; if(st.play&&seg.name!=='CRISTAL') criStop();
  if(seg.k!==st.chan){ if(st.chan>=0&&seg.type!=='zap') st.osd={text:'CH '+String(seg.ch).padStart(2,'0')+(seg.sub?'·'+seg.sub:''),t:performance.now()}; st.chan=seg.k; if(seg.type!=='zap') st.zapCh=-1; }
  useFonts(seg);
  if(w&&t<w){ seg.cbg=seg.bg; seg.cfg=seg.fg; seg.cac=seg.ac; if(seg.logo&&seg.k===1) seg.logo='jac_logo_w'; wipe(seg,t/w); }
  else { const u=w?(t-w)/(1-w):t; if(seg.type==='intro') drawIntro(seg,t); else if(seg.type==='end') drawEnd(seg,u); else seg.fn(seg,u); }
  LATE.forEach(f=>f()); useFonts(null); drawHUD(seg);
  if(st.focus){ useFonts(seg); drawFocus(seg); useFonts(null); }
  if(st.ma>.01) drawMenu();
}

/* --------------------------------------------------------- ENTRADA */
const scrollBy=d=>{ if(st.menu){ st.menu=false; return; } if(st.pz){ st.pz=null; return; } if(st.focus) st.focus=null;
  if(st.extra!=null){ st.exAcc+=d; if(Math.abs(st.exAcc)>320){ exGo(st.exAcc>0?1:-1); st.exAcc=0; } return; }
  if(st.play){ if(performance.now()-st.playAt<1200) return; st.wAcc=(st.wAcc||0)+Math.abs(d); if(st.wAcc<220) return; criStop(); } st.tp=cl((st.tp+d)/st.max)*st.max; };
addEventListener('wheel',e=>{ e.preventDefault(); scrollBy((Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.15); },{passive:false});
addEventListener('keydown',e=>{ const k=e.key;
  if(k==='Escape'){ if(st.pz) st.pz=null; else if(st.focus) st.focus=null; else if(st.menu) st.menu=false; else if(st.extra!=null) exClose(); }
  else if(k==='m'||k==='M') st.menu=!st.menu;
  else if(/^[0-9]$/.test(k)){ const s=SEGS.find(q=>q.ch===+k&&!q.sub); if(s){ st.menu=false; exCloseQuiet(); goSeg(s.k); } }
  else if(st.extra!=null&&!st.focus&&(k==='ArrowRight'||k==='ArrowLeft'||k==='ArrowDown'||k==='ArrowUp')){ e.preventDefault(); exGo(k==='ArrowRight'||k==='ArrowDown'?1:-1); }
  else if(k==='d'||k==='D'){ st.degauss=1; st.clearMag=1; st.osd={text:'DESMAGNETIZANDO',t:performance.now()}; }
  else if(st.focus&&(k==='ArrowRight'||k==='ArrowLeft')){ const i=pieces.findIndex(q=>q.id===st.focus), d=k==='ArrowRight'?1:-1; st.focus=pieces[(i+d+pieces.length)%pieces.length].id; }
  else if(k==='ArrowDown'||k===' '||k==='PageDown'){ e.preventDefault(); scrollBy(H*.45); }
  else if(k==='ArrowUp'||k==='PageUp'){ e.preventDefault(); scrollBy(-H*.45); }
  else if(k==='ArrowRight') goSeg(cur.k+1); else if(k==='ArrowLeft') goSeg(cur.k-1);
});
let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={y:e.clientY,x:e.clientX,o:st.tp,moved:false}; try{cv.setPointerCapture(e.pointerId)}catch(_){} });
cv.addEventListener('pointermove',e=>{ st.mouse.x=e.clientX/W; st.mouse.y=e.clientY/H;
  if(drag){ const dy=e.clientY-drag.y; if(Math.hypot(dy,e.clientX-drag.x)>8) drag.moved=true; if(drag.moved&&!st.focus&&!st.menu&&st.extra==null){ if(st.play) criStop(); st.tp=cl((drag.o-dy*2.2)/st.max)*st.max; } }
  const h=hitAt(e.clientX,e.clientY); st.hover=h?h.id:null; });
cv.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ const h=hitAt(e.clientX,e.clientY); if(h) h.act(); } drag=null; });
cv.addEventListener('pointerleave',()=>{ st.mouse.x=-2; st.mouse.y=-2; st.hover=null; });

/* ---------------------------------------------------------------- BUCLE */
let last=performance.now();
/* Cursor propio, sobre el cristal: un punto y un aro que lo sigue con retraso; crece en lo que se puede pulsar */
const CUR={x:-99,y:-99,rx:-99,ry:-99,r:0,down:0};
addEventListener('pointerdown',()=>{ CUR.down=1; }); addEventListener('pointerup',()=>{ CUR.down=0; });
function drawCursor(dt,now){
  if(st.mouse.x<-1) return; const x=st.mouse.x*W, y=st.mouse.y*H; if(CUR.rx<-50){ CUR.rx=x; CUR.ry=y; }
  const f=1-Math.pow(.0005,dt); CUR.rx+=(x-CUR.rx)*f; CUR.ry+=(y-CUR.ry)*f;
  const hov=!!st.hover, tr=(hov?26:15)*S*(CUR.down?.8:1); CUR.r+=(tr-CUR.r)*(1-Math.pow(.002,dt));
  glassUsed=true; glassDirty=true; gx.save(); gx.globalAlpha=.6;
  gx.lineWidth=4*S; gx.strokeStyle='rgba(0,0,0,.55)'; gx.beginPath(); gx.arc(CUR.rx,CUR.ry,CUR.r,0,7); gx.stroke();
  gx.lineWidth=1.6*S; gx.strokeStyle=hov?SIGNAL:'#ffffff'; gx.beginPath(); gx.arc(CUR.rx,CUR.ry,CUR.r,0,7); gx.stroke();
  if(hov){ gx.fillStyle=rgba(SIGNAL,.18); gx.beginPath(); gx.arc(CUR.rx,CUR.ry,CUR.r,0,7); gx.fill(); }
  gx.fillStyle='rgba(0,0,0,.6)'; gx.beginPath(); gx.arc(x,y,4.6*S,0,7); gx.fill();
  gx.fillStyle=hov?SIGNAL:'#ffffff'; gx.beginPath(); gx.arc(x,y,3*S,0,7); gx.fill();
  gx.restore();
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; st.dt=(now-(st.lt||now))/1000; st.lt=now;
  const pp=st.p; st.p+=(st.tp-st.p)*(1-Math.pow(.0015,dt)); st.v=(st.p-pp)/Math.max(dt,.001);
  st.fa+=((st.focus?1:0)-st.fa)*(1-Math.pow(.0005,dt)); st.ma+=((st.menu?1:0)-st.ma)*(1-Math.pow(.0002,dt)); st.wAcc=(st.wAcc||0)*Math.pow(.05,dt);
  const mx=st.mouse.x>-1?st.mouse.x:.5, my=st.mouse.x>-1?st.mouse.y:.5, ddx=(mx-st.mag.x)*W, ddy=(my-st.mag.y)*H;
  st.mag.x+=(mx-st.mag.x)*(1-Math.pow(.004,dt)); st.mag.y+=(my-st.mag.y)*(1-Math.pow(.004,dt));
  st.speed+=(Math.min(1,Math.hypot(ddx,ddy)/260)-st.speed)*(1-Math.pow(.02,dt));
  st.field+=((reduce||st.mouse.x<-1?0:.2+st.speed*.85)-st.field)*(1-Math.pow(.03,dt));
  st.zap=Math.max(0,st.zap-dt*3.2); st.noise=reduce?0:Math.max(Math.min(.07,Math.abs(st.v)/45000),st.zap*.7);
  st.degauss=Math.max(0,st.degauss-dt*.7);
  if(st.boot<1){ st.boot=Math.min(1,st.boot+dt/.5); st.collapse=1-eo(st.boot); st.noise=Math.max(st.noise,.6*(1-st.boot)); }
  if(st.off){ const e=(now-st.off)/1000; if(e<.35) st.collapse=Math.pow(e/.35,2); else if(e<1) st.collapse=1; else { st.off=0; st.lock=0; st.extra=null; st.menu=false; st.tp=st.p=0; st.boot=0; st.bootAt=now+500; st.collapse=1; for(const k in INKS) delete INKS[k]; } }
  st.tuneOn=false; drawScene();
  st.tune+=((st.tuneOn&&!reduce&&!st.menu?1:0)-st.tune)*(1-Math.pow(.002,dt));
  if(st.snd&&!wanted[st.snd]){ const v=media[st.snd]; if(v) v.muted=true; st.snd=null; }
  for(const k of KEYS){ const v=media[k]; if(!v||!v.play||k.includes('scrub')) continue; if(wanted[k]&&v.paused) v.play().catch(()=>{}); else if(!wanted[k]&&!v.paused) v.pause(); }
  drawCursor(dt,now);
  if(glOK) render(dt,now); else g0.drawImage(glassC,0,0,W,H);
  cv.style.cursor='none';
  requestAnimationFrame(frame);
}
function render(dt,now){
  const bind=p=>{ gl.useProgram(p); gl.bindBuffer(gl.ARRAY_BUFFER,quad); const a=gl.getAttribLocation(p,'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0); };
  const src=magIdx, dst=1-magIdx;
  gl.bindFramebuffer(gl.FRAMEBUFFER,magFb[dst]); gl.viewport(0,0,magW,magH); bind(magProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,magTex[src]); gl.uniform1i(U(magProg,'uPrev'),0);
  gl.uniform2f(U(magProg,'uMouse'),st.mag.x,st.mag.y); gl.uniform1f(U(magProg,'uAsp'),W/H);
  gl.uniform1f(U(magProg,'uAmt'),reduce||st.mouse.x<-1?0:st.speed*(st.tune>.3?.3:.09)); gl.uniform1f(U(magProg,'uClear'),st.clearMag?.12:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4); magIdx=dst; if(st.clearMag) st.clearMag=Math.max(0,st.clearMag-dt*.8);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,cv.width,cv.height); bind(prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene); gl.uniform1i(U(prog,'uScene'),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,magTex[magIdx]); gl.uniform1i(U(prog,'uMag'),1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,window.__glassTex); if(glassDirty){ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,glassC); glassDirty=false; } gl.uniform1i(U(prog,'uGlass'),2);
  gl.uniform2f(U(prog,'uRes'),cv.width,cv.height); gl.uniform2f(U(prog,'uMouse'),st.mag.x,st.mag.y);
  gl.uniform1f(U(prog,'uTime'),(now-st.t0)/1000); gl.uniform1f(U(prog,'uField'),st.field);
  gl.uniform1f(U(prog,'uNoise'),st.noise); gl.uniform1f(U(prog,'uCollapse'),st.collapse);
  gl.uniform1f(U(prog,'uDegauss'),st.degauss); gl.uniform1f(U(prog,'uCalm'),st.focus?1:.35); gl.uniform1f(U(prog,'uPx'),DPR); gl.uniform1f(U(prog,'uTune'),st.tune); gl.uniform1f(U(prog,'uLock'),st.lock);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ------------------------------------------------------------- ARRANQUE */
resize();
Promise.all([
  document.fonts.load('700 40px HV'), document.fonts.load('400 40px HV'), document.fonts.load('400 40px HC'), document.fonts.load('700 40px HC'), document.fonts.load('400 40px CR'), document.fonts.load('italic 40px CR'), document.fonts.load('700 40px CR'), document.fonts.load('400 40px FU'), document.fonts.load('italic 40px FU'), document.fonts.load('500 40px FU'), document.fonts.load('40px FK'), document.fonts.load('italic 40px "Instrument Serif"'), document.fonts.load('40px "Instrument Serif"'),
  document.fonts.load('500 12px "IBM Plex Mono"'), ...CRIT.map(k=>loadOne(k))
].map(p=>Promise.race([p.catch(()=>{}),new Promise(r=>setTimeout(r,1500))]))).then(()=>{ bootEl.classList.add('off'); requestAnimationFrame(frame); lazyLoad(); });
})();
</script>
